name: CI

# Runs on every PR + every push to main. Verifies the theme still passes
# gscan, builds cleanly, and produces a valid pod.zip. Not a release —
# that lives in release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: validate · build · zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: gscan (Ghost 6.x compatibility)
        run: npm run validate

      - name: Build
        run: npm run build

      # `assets/built/` is committed so that installing the theme straight from
      # this repo's zipball yields working CSS/JS. That only holds while the
      # committed output matches its sources, so fail the PR when a change to
      # assets/css or assets/js lands without a rebuild. The build is
      # byte-reproducible (fixed output filenames, no content hashes, no
      # sourcemaps), so a dirty tree here is real drift rather than a flake.
      # `git status` rather than `git diff` — it also catches build output that
      # is new-and-untracked, not just modified.
      - name: Verify committed assets/built is current
        run: |
          drift=$(git status --porcelain -- assets/built)
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::assets/built/ does not match a fresh build. Run 'npm run build' and commit the result."
            exit 1
          fi
          echo "  assets/built/ matches a fresh build"

      - name: Package release zip
        run: npm run zip

      # Upload as a workflow artifact so a reviewer can grab it off a PR
      # without cloning + building locally. Not the same as the release
      # asset — release.yml attaches its own build to the GitHub Release.
      - name: Upload pod.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: pod-zip
          path: pod.zip
          if-no-files-found: error
          retention-days: 14
